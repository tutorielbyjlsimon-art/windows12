# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Use a stable LTS
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci # Use ci for more reliable builds in CI
        
      - name: Build
        run: npm run build
        
      - name: Check build output
        run: ls -R dist # Debug: ensure dist exists
        
      - name: Setup Pages
        uses: actions/configure-pages@v5 # Upgraded version
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
